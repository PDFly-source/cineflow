*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#05070D;color:var(--tx);font-family:Manrope,system-ui,sans-serif}
body{padding:calc(24px + env(safe-area-inset-top,0px)) 12px calc(32px + env(safe-area-inset-bottom,0px))}
.top{max-width:860px;margin:0 auto 24px}.top h1{font-size:26px;font-weight:800;letter-spacing:-.02em}.top p{font-size:14px;color:var(--t2);margin-top:6px;line-height:1.5}
.board{display:flex;flex-wrap:wrap;gap:28px;justify-content:center}
figure{display:flex;flex-direction:column;gap:8px;align-items:center}figcaption{font-size:13px;font-weight:700;color:var(--t3)}
.ph{width:393px;height:852px;border-radius:44px;background:var(--ob);border:1px solid var(--bd);box-shadow:0 30px 70px rgba(0,0,0,.6);position:relative;overflow:hidden;display:flex;flex-direction:column;padding:18px 18px 0}
.ph:before{content:"";position:absolute;inset:0;background:radial-gradient(380px 320px at 15% 0,rgba(105,85,255,.3),transparent 70%),radial-gradient(300px 260px at 100% 70%,rgba(53,216,242,.09),transparent 70%);pointer-events:none}
.ph>*{position:relative}
.sc{flex:1;overflow:hidden;display:flex;flex-direction:column;gap:12px}
@media(max-width:420px){.ph{zoom:.92}}@media(max-width:900px){.ls{zoom:.42}}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic,.wm{background:var(--logo) no-repeat #000;mix-blend-mode:lighten}
.ic{width:44px;height:44px;background-size:200%;background-position:49% 40%}
.wm{width:124px;height:26px;background-size:194px;background-position:51% 74.5%}
.brand{display:flex;align-items:center;gap:10px;height:48px}.sp{flex:1}
.ib{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid var(--bd);display:grid;place-items:center;color:var(--t2)}
.scene{position:relative;overflow:hidden;background:radial-gradient(circle at 72% 30%,#FFE2A8 0,#FF9A7A 5%,rgba(255,154,122,.0) 18%),linear-gradient(180deg,#14123F,#4A3B9C 48%,#C06FA0 80%,#2B2350)}
.scene:before{content:"";position:absolute;inset:0;background:#171445;clip-path:polygon(0 68%,18% 50%,32% 62%,50% 36%,66% 60%,82% 46%,100% 66%,100% 100%,0 100%)}
.scene:after{content:"";position:absolute;inset:0;background:#0A0B1E;clip-path:polygon(0 85%,24% 70%,44% 83%,68% 68%,100% 84%,100% 100%,0 100%)}
.shade{position:absolute;inset:0;z-index:2;background:linear-gradient(180deg,rgba(8,11,20,.55),transparent 35%,rgba(8,11,20,.92))}
.z{position:absolute;z-index:3}
.hero{height:420px;border-radius:32px;border:1px solid #34416A}
h1.h{font-size:33px;line-height:1.05;font-weight:800;letter-spacing:-.035em}
.sub{font-size:13.5px;line-height:1.5;color:var(--t2)}
.btn{height:54px;border-radius:27px;display:flex;align-items:center;justify-content:center;gap:10px;font:800 15px Manrope;color:#fff}
.pri{background:linear-gradient(135deg,var(--ev),#4F7BFF);box-shadow:0 10px 30px rgba(105,85,255,.45)}
.gl{background:rgba(8,11,20,.55);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(8px)}
.bento{display:grid;grid-template-columns:1.2fr 1fr;grid-template-rows:auto auto;gap:10px}
.cell{background:linear-gradient(180deg,var(--es),var(--dn));border:1px solid var(--bd);border-radius:22px;padding:14px;font-size:12.5px;color:var(--t2);line-height:1.4}
.cell b{display:flex;gap:8px;align-items:center;color:var(--tx);font-size:14px;margin-bottom:5px}
.cell.tall{grid-row:span 2}
.cy{color:var(--cy)}.lv{color:var(--lav)}
.pill{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));height:64px;width:350px;border-radius:32px;background:rgba(19,26,43,.94);border:1px solid #34416A;display:flex;align-items:center;justify-content:space-around;box-shadow:0 14px 40px rgba(0,0,0,.6);z-index:5}
.pill a{width:56px;height:48px;display:grid;place-items:center;color:var(--t3);position:relative}.pill a.on{color:var(--tx)}.pill a.on:after{content:"";position:absolute;bottom:2px;width:5px;height:5px;border-radius:50%;background:var(--cy)}
.pill .fab{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--ev),#4F7BFF);color:#fff;margin-top:-26px;box-shadow:0 0 0 6px var(--ob),0 10px 26px rgba(105,85,255,.5)}
.chip{height:36px;padding:0 14px;border-radius:18px;background:var(--es);border:1px solid var(--bd);display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--t2);white-space:nowrap}
.chip.on{background:rgba(105,85,255,.22);border-color:var(--ev);color:var(--tx)}
.sl i{display:block;height:4px;border-radius:4px;background:rgba(255,255,255,.22);position:relative}
.sl i:before{content:"";position:absolute;inset:0 auto 0 0;width:var(--p);border-radius:4px;background:linear-gradient(90deg,var(--cy),var(--bv))}
.sl i:after{content:"";position:absolute;left:var(--p);top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(105,85,255,.35)}
.rnd{width:52px;height:52px;border-radius:50%;display:grid;place-items:center}
.bigp{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--ev),#4F7BFF);display:grid;place-items:center;box-shadow:0 0 0 8px rgba(105,85,255,.22),0 10px 30px rgba(105,85,255,.5)}
.bigp svg{fill:#fff;stroke:#fff;width:30px;height:30px}
.ls{width:852px;height:393px;border-radius:40px;background:#000;border:1px solid var(--bd);box-shadow:0 30px 70px rgba(0,0,0,.6);position:relative;overflow:hidden}
.card{background:linear-gradient(180deg,var(--es),var(--dn));border:1px solid var(--bd);border-radius:22px;padding:14px}
.emp{display:flex;gap:12px;align-items:center}.emp p{font-size:12.5px;color:var(--t3);line-height:1.45}.emp strong{display:block;font-size:14px;color:var(--t2);margin-bottom:2px}
.tile{width:44px;height:44px;border-radius:14px;background:var(--ss);display:grid;place-items:center;color:var(--bv);flex:none}
.spl{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;text-align:center}
.spl .logo{width:290px;height:290px;background:var(--logo) center/cover;border-radius:40px;box-shadow:0 0 100px rgba(105,85,255,.4)}
.spl p{font-size:12px;font-weight:700;letter-spacing:.22em;color:var(--t2);padding-bottom:70px}
.g{display:flex;gap:12px;align-items:center;font-size:12.5px;color:var(--t2);line-height:1.35}.g b{display:block;color:var(--tx);font-size:14px}
.row{display:flex;align-items:center;gap:12px;min-height:54px;border-bottom:1px solid var(--bd);font-size:14.5px;font-weight:700}.row:last-child{border:0}.row div:first-child{flex:1}
.tg{width:48px;height:28px;border-radius:14px;background:#2A3652;position:relative}.tg:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff}.tg.on{background:var(--ev)}.tg.on:after{left:23px}
.seg{display:flex;background:var(--dn);border:1px solid var(--bd);border-radius:14px;padding:3px}.seg span{padding:8px 11px;border-radius:11px;font-size:12.5px;font-weight:700;color:var(--t3)}.seg span.on{background:var(--ss);color:var(--tx)}.cap{position:absolute;left:0;right:0;text-align:center;font:800 17px Manrope;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000}.row .sl{flex:1}.row .sl i{background:#2A3652}.dot{width:26px;height:26px;border-radius:50%;display:inline-block}
/* === CINEFLOW PREMIUM REDESIGN OVERRIDES === */
:root{color-scheme:dark;--ob:#080B14;--dn:#0D1222;--es:#131A2B;--ss:#192338;--ev:#6955FF;--bv:#806BFF;--cy:#35D8F2;--lav:#B8ADFF;--tx:#F5F7FF;--t2:#A4AEC4;--t3:#77839C;--bd:#263149;--ok:#42D6A0;--wa:#FFC66D}
html{scroll-behavior:smooth;background:#05070D}
body{background:radial-gradient(ellipse at 50% -10%,rgba(105,85,255,.17),transparent 42%),#05070D;padding:28px 18px 48px}
.top{max-width:1240px;margin:0 auto 30px;padding:26px 28px;border:1px solid rgba(128,107,255,.22);border-radius:26px;background:linear-gradient(135deg,rgba(19,26,43,.96),rgba(8,11,20,.96));box-shadow:0 24px 70px rgba(0,0,0,.28);position:relative;overflow:hidden}
.top:after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;right:-70px;top:-110px;background:rgba(53,216,242,.08);filter:blur(12px);pointer-events:none}
.top h1{font-size:clamp(22px,3vw,34px);letter-spacing:-.045em;line-height:1.15;position:relative;z-index:1}
.top p{max-width:760px;font-size:14px;line-height:1.7;margin-top:10px;position:relative;z-index:1}
.board{max-width:1440px;margin:0 auto;gap:34px 30px;align-items:flex-start}
figure{padding:0 0 8px;gap:12px;filter:drop-shadow(0 14px 28px rgba(0,0,0,.18))}
figcaption{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#9AA8C3;font-weight:800}
.ph{border-radius:38px;border-color:#2B3650;background:linear-gradient(180deg,#0B1020,#080B14);box-shadow:0 30px 80px rgba(0,0,0,.58),inset 0 1px 0 rgba(255,255,255,.045)}
.ph:before{background:radial-gradient(360px 300px at 8% 0,rgba(105,85,255,.25),transparent 72%),radial-gradient(260px 240px at 100% 76%,rgba(53,216,242,.075),transparent 72%)}
.ls{border-radius:34px;border-color:#2B3650;box-shadow:0 30px 80px rgba(0,0,0,.58),inset 0 1px 0 rgba(255,255,255,.04)}
.hero{border-radius:30px;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 18px 42px rgba(0,0,0,.22);background:radial-gradient(circle at 72% 30%,#FFE2A8 0,#FF9A7A 5%,rgba(255,154,122,0) 18%),linear-gradient(180deg,#14123F,#4A3B9C 48%,#C06FA0 80%,#2B2350)}
.btn{letter-spacing:-.015em;cursor:default;transition:transform .18s ease,filter .18s ease;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.pri{background:linear-gradient(135deg,#725DFF 0%,#5B4AF4 48%,#477EFF 100%);box-shadow:0 10px 28px rgba(105,85,255,.32),inset 0 1px 0 rgba(255,255,255,.2)}
.gl{background:rgba(10,14,27,.64);border-color:rgba(203,213,238,.2);backdrop-filter:blur(16px)}
.card,.cell{box-shadow:inset 0 1px 0 rgba(255,255,255,.025)}
.cell{background:linear-gradient(155deg,rgba(25,35,56,.98),rgba(13,18,34,.98));border-color:#293651}
.pill{background:rgba(16,22,39,.94);border-color:rgba(105,85,255,.3);backdrop-filter:blur(20px);box-shadow:0 16px 44px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.04)}
.pill .fab{background:linear-gradient(140deg,#806BFF,#4F7BFF);box-shadow:0 0 0 6px var(--ob),0 10px 28px rgba(105,85,255,.38)}
.chip{background:rgba(19,26,43,.9);border-color:#2B3650}
.chip.on{background:rgba(105,85,255,.18);border-color:rgba(128,107,255,.65);box-shadow:inset 0 0 0 1px rgba(128,107,255,.08)}
.tile{background:linear-gradient(145deg,#202B48,#141B2E);border:1px solid rgba(128,107,255,.16)}
