<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0f17"/>
      <stop offset="50%" stop-color="#141a29"/>
      <stop offset="100%" stop-color="#090c13"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="40%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Cinematic Aperture Ring -->
  <circle cx="256" cy="256" r="190" stroke="url(#ringGrad)" stroke-width="4" fill="none"/>
  <circle cx="256" cy="256" r="160" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 8" fill="none" opacity="0.4"/>
  
  <!-- Film Shutter Ticks -->
  <line x1="256" y1="56" x2="256" y2="76" stroke="#06b6d4" stroke-width="3" stroke-linecap="round"/>
  <line x1="256" y1="436" x2="256" y2="456" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round"/>
  <line x1="56" y1="256" x2="76" y2="256" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
  <line x1="436" y1="256" x2="456" y2="256" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round"/>

  <!-- Play Symbol with Cinematic Energy -->
  <path d="M 205 160 L 350 256 L 205 352 Z" 
        fill="url(#primaryGrad)" 
        filter="url(#glow)"/>
        
  <!-- Subtle Highlight Beam -->
  <path d="M 215 178 L 330 256 L 215 268 Z" 
        fill="#ffffff" 
        opacity="0.25"/>
</svg>
